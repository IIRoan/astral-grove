name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'bun.lock'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    environment: internal-releases
    name: Publish Expo Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the astralgrove Expo account."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Same Bun as the build workflow so installs, and therefore fingerprints, match the builds.
          bun-version-file: .bun-version

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.6.0

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: .
        run: bun run --cwd packages/contracts build

      - name: Publish production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://riftapi.solace.onl
        run: |
          APP_VARIANT=production eas update --branch main --environment production --message "${{ github.sha }}" --non-interactive

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://riftapi.solace.onl
        run: |
          APP_VARIANT=preview eas update --branch preview --environment preview --message "preview ${{ github.sha }}" --non-interactive
