name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Checks and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riftbound
          POSTGRES_PASSWORD: riftbound
          POSTGRES_DB: riftbound_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U riftbound -d riftbound_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DB_URL: postgres://riftbound:riftbound@127.0.0.1:5433/riftbound_test
      ASTRAL_BACKEND_BIN: ${{ github.workspace }}/target/debug/astral-grove-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Native Rust units, probes and migration inventory
        run: |
          cargo test --workspace --locked
          cargo build --package astral-grove-server --bins --locked
          cargo xtask baseline
      - name: Runtime schema and business rule parity
        run: |
          bun --no-env-file scripts/rust-migration/validation-corpus.mjs --check-rust
          bun --no-env-file scripts/rust-migration/business-corpus.ts --check-rust
          bun --no-env-file scripts/rust-migration/auth-validation-corpus.mjs --check-rust
      - name: Shared, mobile and reference unit tests
        run: |
          bun test scripts/lib/internal-release.test.ts scripts/rust-migration/test-target.test.ts
          bun run --cwd packages/contracts test
          bun run --cwd tests/reference-api test
          bun run --cwd apps/mobile test
      - name: Native HTTP and original compatibility suites against the development binary
        run: |
          bun run --cwd apps/backend test:http
          bun run --cwd apps/backend test:compat
      - name: Auth protocol and malformed input parity against the development binary
        run: |
          bun --no-env-file scripts/rust-migration/auth-parity.ts
          bun --no-env-file scripts/rust-migration/http-boundary-parity.ts
      - name: Development server diagnostics
        if: failure()
        run: cat /tmp/astral-native-test-*.log /tmp/astral-auth-parity-server.log /tmp/astral-grove-rust-e2e-server.log 2>/dev/null || true
  backend-image:
    name: Production image tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riftbound
          POSTGRES_PASSWORD: riftbound
          POSTGRES_DB: riftbound_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U riftbound -d riftbound_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DB_URL: postgres://riftbound:riftbound@127.0.0.1:5433/riftbound_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/contracts build
      - uses: docker/setup-buildx-action@v3
      - name: Build production Rust image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: astral-grove-backend:ci
          cache-from: type=gha,scope=astral-grove-backend
          cache-to: type=gha,scope=astral-grove-backend,mode=max
      - name: Verify native runtime and extract its binary
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' astral-grove-backend:ci)" = '10001:10001'
          docker run --rm --entrypoint /bin/sh astral-grove-backend:ci -ec 'if command -v bun || command -v node; then exit 1; fi'
          container_id=$(docker create astral-grove-backend:ci)
          docker cp "$container_id:/usr/local/bin/astral-grove-server" "$RUNNER_TEMP/astral-grove-server"
          docker rm "$container_id"
          chmod +x "$RUNNER_TEMP/astral-grove-server"
          sha256sum "$RUNNER_TEMP/astral-grove-server"
          echo "ASTRAL_BACKEND_BIN=$RUNNER_TEMP/astral-grove-server" >> "$GITHUB_ENV"
      - name: Production container health, secure auth, SSE and SIGTERM drain
        run: bun --no-env-file apps/backend/test/container-smoke.ts astral-grove-backend:ci
      - name: Native HTTP and original compatibility suites against the release binary
        run: |
          bun run --cwd apps/backend test:http
          bun run --cwd apps/backend test:compat
      - name: Auth protocol and malformed input parity against the release binary
        run: |
          bun --no-env-file scripts/rust-migration/auth-parity.ts
          bun --no-env-file scripts/rust-migration/http-boundary-parity.ts
      - name: Packaged server diagnostics
        if: failure()
        run: cat /tmp/astral-native-test-*.log /tmp/astral-auth-parity-server.log /tmp/astral-grove-rust-e2e-server.log 2>/dev/null || true
