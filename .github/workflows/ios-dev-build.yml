name: iOS development build

# A stand-in for `eas build` that does not spend cloud build credits. EAS still does
# the work and still manages the signing credentials, but `--local` runs the build on
# GitHub's macOS runner instead of Expo's infrastructure, which Expo documents as
# always free. The repo is public, so macOS runner minutes are free too.
# The IPA is not uploaded to Expo: registering a local build there is metered on the
# free plan. It is attached to the run encrypted instead; see the install script.
on:
  pull_request:
    # PRs aimed at main get the `development` profile, matching how these were built
    # on EAS before.
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A PR update supersedes whatever was already building — iOS builds are slow and
# there is no point finishing one for a commit that has been replaced.
concurrency:
  group: ios-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # post install instructions back onto the PR

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test native scan worker and image processing
        run: |
          swiftc apps/mobile/modules/card-ocr-frame/ios/ScanWorker.swift \
            apps/mobile/modules/card-ocr-frame/test/ScanWorkerTests.swift \
            -o "$RUNNER_TEMP/scan-worker-tests"
          "$RUNNER_TEMP/scan-worker-tests"
          # CoreImage and Vision ship on macOS too, so the crop maths runs on the runner.
          swiftc apps/mobile/modules/card-ocr-frame/ios/CardImageProcessing.swift \
            apps/mobile/modules/card-ocr-frame/test/ImageProcessingTests.swift \
            -o "$RUNNER_TEMP/image-processing-tests"
          "$RUNNER_TEMP/image-processing-tests"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .ipa
        working-directory: apps/mobile
        # --local keeps it off Expo's builders; credentials are still fetched from EAS,
        # so this signs with the same ad-hoc profile (and registered devices) as before.
        run: |
          set -o pipefail

          # EAS prints the whole credential configuration before it builds: the Apple
          # Team and account holder's name, certificate serial, provisioning profile
          # id, and every provisioned device by name and UDID. Workflow logs on a
          # public repo are world-readable, so that block is scrubbed on its way to
          # the console. pipefail keeps the build's own exit code.
          eas build \
            --platform ios \
            --profile development \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/astral-grove.ipa" 2>&1 | sed -E \
              -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/[redacted udid]/g' \
              -e 's/\b[0-9A-Fa-f]{40}\b/[redacted udid]/g' \
              -e 's/^([[:space:]]*(Apple Team|Serial Number|Developer Portal ID)[[:space:]]+).*/\1[redacted]/' \
              -e 's/^([[:space:]]*-[[:space:]]+).*\(UDID:.*/\1[redacted device]/' \
              -e 's/^([[:space:]]*Provisioned devices[[:space:]]+).*/\1[redacted]/'

      # Artifacts on a public repo can be downloaded by any signed-in GitHub user, and an
      # ad-hoc IPA embeds its provisioning profile: team name and every registered UDID.
      # Encrypt it to a key whose private half only lives on the developer's machine.
      - name: Encrypt IPA
        run: |
          command -v gpg >/dev/null || brew install gnupg
          gpg --batch --yes \
            --recipient-file .github/ios-dev-build-key.asc \
            --output "$RUNNER_TEMP/astral-grove.ipa.gpg" \
            --encrypt "$RUNNER_TEMP/astral-grove.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-dev-build
          path: ${{ runner.temp }}/astral-grove.ipa.gpg
          retention-days: 14
          if-no-files-found: error

      - name: Post install instructions on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ios-dev-build
          message: |
            ### iOS development build ready

            Built from `${{ github.sha }}` with the `development` profile. The IPA is attached to [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), encrypted.

            With the iPhone connected over USB, install the newest build for this branch:

            ```bash
            bash apps/mobile/scripts/install-ios-dev-build.sh
            ```

            Requires this device's UDID to be registered for ad-hoc distribution.
