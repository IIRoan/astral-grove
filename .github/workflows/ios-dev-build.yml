name: iOS development build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to publish as the latest slot
        type: choice
        options:
          - development
          - preview
        default: development

concurrency:
  group: ios-dev-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      PROFILE: ${{ inputs.profile || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve profile metadata
        id: meta
        run: |
          set -euo pipefail
          case "$PROFILE" in
            development)
              echo "app_variant=development" >> "$GITHUB_OUTPUT"
              echo "bundle_id=com.iroan.astralgrove.dev" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Dev" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              echo "app_variant=preview" >> "$GITHUB_OUTPUT"
              echo "bundle_id=com.iroan.astralgrove" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Preview" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown PROFILE=$PROFILE" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test native scan worker and image processing
        run: |
          swiftc apps/mobile/modules/card-ocr-frame/ios/ScanWorker.swift \
            apps/mobile/modules/card-ocr-frame/test/ScanWorkerTests.swift \
            -o "$RUNNER_TEMP/scan-worker-tests"
          "$RUNNER_TEMP/scan-worker-tests"
          swiftc apps/mobile/modules/card-ocr-frame/ios/CardImageProcessing.swift \
            apps/mobile/modules/card-ocr-frame/test/ImageProcessingTests.swift \
            -o "$RUNNER_TEMP/image-processing-tests"
          "$RUNNER_TEMP/image-processing-tests"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .ipa
        working-directory: apps/mobile
        env:
          APP_VARIANT: ${{ steps.meta.outputs.app_variant }}
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/astral-grove.ipa" 2>&1 | sed -E \
              -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/[redacted udid]/g' \
              -e 's/\b[0-9A-Fa-f]{40}\b/[redacted udid]/g' \
              -e 's/^([[:space:]]*(Apple Team|Serial Number|Developer Portal ID)[[:space:]]+).*/\1[redacted]/' \
              -e 's/^([[:space:]]*-[[:space:]]+).*\(UDID:.*/\1[redacted device]/' \
              -e 's/^([[:space:]]*Provisioned devices[[:space:]]+).*/\1[redacted]/'

      - name: Publish latest slot to R2
        id: publish
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/astral-grove.ipa"

          EXTRACT_DIR="$RUNNER_TEMP/ipa-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$IPA_PATH" -d "$EXTRACT_DIR" 'Payload/*.app/Info.plist'
          INFO_PLIST=$(echo "$EXTRACT_DIR"/Payload/*.app/Info.plist)
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          test -n "$BUNDLE_VERSION"

          bun scripts/publish-ios-r2-release.ts \
            --profile "$PROFILE" \
            --ipa "$IPA_PATH" \
            --bundle-id "${{ steps.meta.outputs.bundle_id }}" \
            --bundle-version "$BUNDLE_VERSION" \
            --title "${{ steps.meta.outputs.title }}" \
            --out-dir "$RUNNER_TEMP/r2-publish"

          {
            echo "### iOS ${PROFILE} → \`releases/${PROFILE}.ipa\`"
            echo
            echo "Commit \`${GITHUB_SHA}\`. Install QR sent to Discord."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send install QR to Discord
        env:
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK secret is not set" >&2
            exit 1
          fi

          QR_PATH="$RUNNER_TEMP/r2-publish/${PROFILE}-qr.png"
          test -f "$QR_PATH"

          REF_LINE="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_LINE="PR #${{ github.event.pull_request.number }} · $GITHUB_SHA"
          fi

          bun scripts/notify-ios-discord.ts \
            --webhook "$DISCORD_WEBHOOK" \
            --qr "$QR_PATH" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --ref "$REF_LINE"
