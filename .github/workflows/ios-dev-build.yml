name: iOS development build

# Local EAS build on GitHub's macOS runner (no Expo cloud build credits).
# Publishes at most two IPAs to R2 under releases/: development.ipa and preview.ipa.
# Optional secret S3_PUBLIC_BASE_URL (R2 custom domain) gives stable latest URLs;
# without it, the workflow emits 7-day presigned install links.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to publish as the latest slot
        type: choice
        options:
          - development
          - preview
        default: development

concurrency:
  group: ios-dev-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      PROFILE: ${{ inputs.profile || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve profile metadata
        id: meta
        run: |
          set -euo pipefail
          case "$PROFILE" in
            development)
              echo "app_variant=development" >> "$GITHUB_OUTPUT"
              echo "bundle_id=com.iroan.astralgrove.dev" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Dev" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              echo "app_variant=preview" >> "$GITHUB_OUTPUT"
              echo "bundle_id=com.iroan.astralgrove" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Preview" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown PROFILE=$PROFILE" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test native scan worker and image processing
        run: |
          swiftc apps/mobile/modules/card-ocr-frame/ios/ScanWorker.swift \
            apps/mobile/modules/card-ocr-frame/test/ScanWorkerTests.swift \
            -o "$RUNNER_TEMP/scan-worker-tests"
          "$RUNNER_TEMP/scan-worker-tests"
          swiftc apps/mobile/modules/card-ocr-frame/ios/CardImageProcessing.swift \
            apps/mobile/modules/card-ocr-frame/test/ImageProcessingTests.swift \
            -o "$RUNNER_TEMP/image-processing-tests"
          "$RUNNER_TEMP/image-processing-tests"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .ipa
        working-directory: apps/mobile
        env:
          APP_VARIANT: ${{ steps.meta.outputs.app_variant }}
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/astral-grove.ipa" 2>&1 | sed -E \
              -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/[redacted udid]/g' \
              -e 's/\b[0-9A-Fa-f]{40}\b/[redacted udid]/g' \
              -e 's/^([[:space:]]*(Apple Team|Serial Number|Developer Portal ID)[[:space:]]+).*/\1[redacted]/' \
              -e 's/^([[:space:]]*-[[:space:]]+).*\(UDID:.*/\1[redacted device]/' \
              -e 's/^([[:space:]]*Provisioned devices[[:space:]]+).*/\1[redacted]/'

      - name: Publish latest slot to R2
        id: publish
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/astral-grove.ipa"

          EXTRACT_DIR="$RUNNER_TEMP/ipa-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$IPA_PATH" -d "$EXTRACT_DIR" 'Payload/*.app/Info.plist'
          INFO_PLIST=$(echo "$EXTRACT_DIR"/Payload/*.app/Info.plist)
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          test -n "$BUNDLE_VERSION"

          bun scripts/publish-ios-r2-release.ts \
            --profile "$PROFILE" \
            --ipa "$IPA_PATH" \
            --bundle-id "${{ steps.meta.outputs.bundle_id }}" \
            --bundle-version "$BUNDLE_VERSION" \
            --title "${{ steps.meta.outputs.title }}" \
            --out-dir "$RUNNER_TEMP/r2-publish"

          PUBLISH_JSON="$RUNNER_TEMP/r2-publish/publish.json"
          PUBLIC=$(bun -e "console.log(JSON.parse(await Bun.file(process.argv[2]).text()).public ? 'true' : 'false')" "$PUBLISH_JSON")
          {
            echo "### iOS ${PROFILE} build published to R2"
            echo
            echo "- Slot: \`releases/${PROFILE}.ipa\` (max two IPAs: development + preview)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ "$PUBLIC" = "true" ]; then
              IPA_URL=$(bun -e "console.log(JSON.parse(await Bun.file(process.argv[2]).text()).ipaUrl)" "$PUBLISH_JSON")
              echo "- Public latest: [Download .ipa](${IPA_URL})"
            else
              echo "- Presigned install links (7d) are on the PR comment / step outputs — set \`S3_PUBLIC_BASE_URL\` for stable public latest URLs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post install QR on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ios-dev-build
          message: |
            ### iOS ${{ env.PROFILE }} build ready

            Latest `${{ env.PROFILE }}` slot on R2 (`releases/${{ env.PROFILE }}.ipa`).
            Scan with Camera on a registered ad-hoc device.

            <img src="${{ steps.publish.outputs.qr_url }}" width="240" alt="Install QR" />

            [Download .ipa](${{ steps.publish.outputs.ipa_url }})

            Built from `${{ github.sha }}`.
            Without `S3_PUBLIC_BASE_URL`, install links are 7-day presigned URLs — re-run for a fresh QR.
