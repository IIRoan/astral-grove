name: Mobile internal build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to publish as the latest slot
        type: choice
        options:
          - development
          - preview
        default: development

concurrency:
  group: mobile-internal-${{ github.ref }}-${{ github.event_name == 'push' && 'preview' || inputs.profile || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The API keeps the bucket private and signs fresh downloads when the permanent links are opened.
  S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL || 'https://riftapi.solace.onl/api/v1' }}

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    environment: internal-releases
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.meta.outputs.profile }}
      app_variant: ${{ steps.meta.outputs.app_variant }}
      ios_bundle_id: ${{ steps.meta.outputs.ios_bundle_id }}
      android_package: ${{ steps.meta.outputs.android_package }}
      title: ${{ steps.meta.outputs.title }}
      ios_fingerprint: ${{ steps.fingerprint.outputs.ios_fingerprint }}
      android_fingerprint: ${{ steps.fingerprint.outputs.android_fingerprint }}
    steps:
      - name: Resolve profile metadata
        id: meta
        env:
          # Main pushes publish preview; manual builds select development or preview.
          PROFILE: ${{ github.event_name == 'push' && 'preview' || inputs.profile || 'development' }}
        run: |
          set -euo pipefail
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          case "$PROFILE" in
            development)
              echo "app_variant=development" >> "$GITHUB_OUTPUT"
              echo "ios_bundle_id=com.iroan.astralgrove.dev" >> "$GITHUB_OUTPUT"
              echo "android_package=com.iroan.astralgrove.dev" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Dev" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              echo "app_variant=preview" >> "$GITHUB_OUTPUT"
              echo "ios_bundle_id=com.iroan.astralgrove" >> "$GITHUB_OUTPUT"
              echo "android_package=com.iroan.astralgrove" >> "$GITHUB_OUTPUT"
              echo "title=Astral Grove Preview" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown PROFILE=$PROFILE" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Resolving fingerprints evaluates app config plugins, so this job holds no storage credentials.
      - name: Resolve native fingerprints
        id: fingerprint
        env:
          PROFILE: ${{ steps.meta.outputs.profile }}
        run: bun scripts/internal-build-fingerprint.ts resolve --profile "$PROFILE"

  plan:
    needs: meta
    environment: internal-releases
    runs-on: ubuntu-latest
    outputs:
      build_ios: ${{ steps.plan.outputs.build_ios }}
      build_android: ${{ steps.plan.outputs.build_android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Preview JS ships via EAS Update, so main pushes only rebuild when the native fingerprint moves.
      # Manual development builds always embed the selected main revision.
      - name: Compare native fingerprints with the last build
        id: plan
        env:
          PROFILE: ${{ needs.meta.outputs.profile }}
          FORCE: ${{ github.event_name != 'push' && '--force' || '' }}
          IOS_FINGERPRINT: ${{ needs.meta.outputs.ios_fingerprint }}
          ANDROID_FINGERPRINT: ${{ needs.meta.outputs.android_fingerprint }}
          S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.RELEASE_S3_REGION }}
        run: |
          args=()
          if [ -n "$FORCE" ]; then args+=("$FORCE"); fi
          bun scripts/internal-build-fingerprint.ts check --profile "$PROFILE" \
            --ios-fingerprint "$IOS_FINGERPRINT" \
            --android-fingerprint "$ANDROID_FINGERPRINT" "${args[@]}"

  # Build jobs run the app toolchain with only EXPO_TOKEN; publish holds the storage credentials.
  ios:
    needs: [meta, plan]
    environment: internal-releases
    if: needs.plan.outputs.build_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
    outputs:
      bundle_version: ${{ steps.artifact.outputs.bundle_version }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test native scan worker and image processing
        run: |
          swiftc apps/mobile/modules/card-ocr-frame/ios/ScanWorker.swift \
            apps/mobile/modules/card-ocr-frame/test/ScanWorkerTests.swift \
            -o "$RUNNER_TEMP/scan-worker-tests"
          "$RUNNER_TEMP/scan-worker-tests"
          swiftc apps/mobile/modules/card-ocr-frame/ios/CardImageProcessing.swift \
            apps/mobile/modules/card-ocr-frame/test/ImageProcessingTests.swift \
            -o "$RUNNER_TEMP/image-processing-tests"
          "$RUNNER_TEMP/image-processing-tests"

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.6.0

      - name: Build .ipa
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: ${{ needs.meta.outputs.app_variant }}
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/astral-grove.ipa" 2>&1 | sed -E \
              -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/[redacted udid]/g' \
              -e 's/\b[0-9A-Fa-f]{40}\b/[redacted udid]/g' \
              -e 's/(Apple Team( ID)?[[:space:]]*[:=]?[[:space:]]*)[^[:space:])]+/\1[redacted]/g' \
              -e 's/^([[:space:]]*(Serial Number|Developer Portal ID)[[:space:]]+).*/\1[redacted]/' \
              -e 's/^([[:space:]]*-[[:space:]]+).*\(UDID:.*/\1[redacted device]/' \
              -e 's/^([[:space:]]*Provisioned devices[[:space:]]+).*/\1[redacted]/'

      - name: Inspect .ipa
        id: artifact
        env:
          FINGERPRINT: ${{ needs.meta.outputs.ios_fingerprint }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/astral-grove.ipa"

          EXTRACT_DIR="$RUNNER_TEMP/ipa-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$IPA_PATH" -d "$EXTRACT_DIR" 'Payload/*.app/Info.plist' 'Payload/*.app/Expo.plist'
          APP_DIR=$(echo "$EXTRACT_DIR"/Payload/*.app)
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")
          test -n "$BUNDLE_VERSION"

          # EAS Update publishes from Linux; if macOS embeds a different runtime, OTA updates would miss this build.
          EMBEDDED_RUNTIME=$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$APP_DIR/Expo.plist")
          if [ "$EMBEDDED_RUNTIME" != "$FINGERPRINT" ]; then
            echo "::warning::iOS build embeds runtime $EMBEDDED_RUNTIME but Linux resolves $FINGERPRINT; EAS updates will not reach this build"
          fi

          echo "bundle_version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$IPA_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/astral-grove.ipa
          if-no-files-found: error
          retention-days: 1

  android:
    needs: [meta, plan]
    environment: internal-releases
    if: needs.plan.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.6.0

      - name: Build .apk
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: ${{ needs.meta.outputs.app_variant }}
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/astral-grove.apk"

      - name: Hash .apk
        id: artifact
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/astral-grove.apk" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: ${{ runner.temp }}/astral-grove.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [meta, plan, ios, android]
    environment: internal-releases
    # Runs when at least one platform was rebuilt and none failed; a skipped platform keeps its last artifact.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.meta.result == 'success' &&
      needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      (needs.ios.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
      TITLE: ${{ needs.meta.outputs.title }}
      BUILT_IOS: ${{ needs.ios.result == 'success' }}
      BUILT_ANDROID: ${{ needs.android.result == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # The install page needs qrcode; no lifecycle scripts run next to the release credentials.
      - name: Install publisher dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download iOS artifact
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/artifacts

      - name: Download Android artifact
        if: needs.android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-apk
          path: ${{ runner.temp }}/artifacts

      - name: Verify artifact checksums
        working-directory: ${{ runner.temp }}/artifacts
        env:
          IOS_SHA256: ${{ needs.ios.outputs.sha256 }}
          ANDROID_SHA256: ${{ needs.android.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$BUILT_IOS" = "true" ]; then
            echo "$IOS_SHA256  astral-grove.ipa" | sha256sum --check --strict
          fi
          if [ "$BUILT_ANDROID" = "true" ]; then
            echo "$ANDROID_SHA256  astral-grove.apk" | sha256sum --check --strict
          fi

      - name: Publish iOS artifact to R2
        if: needs.ios.result == 'success'
        env:
          BUNDLE_ID: ${{ needs.meta.outputs.ios_bundle_id }}
          BUNDLE_VERSION: ${{ needs.ios.outputs.bundle_version }}
          S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          RELEASE_LINK_SECRET: ${{ secrets.RELEASE_LINK_SECRET }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.RELEASE_S3_REGION }}
        run: |
          set -euo pipefail
          bun scripts/publish-ios-r2-release.ts \
            --profile "$PROFILE" \
            --ipa "$RUNNER_TEMP/artifacts/astral-grove.ipa" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUNDLE_VERSION" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

      - name: Publish Android artifact to R2
        if: needs.android.result == 'success'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.RELEASE_S3_REGION }}
        run: |
          set -euo pipefail
          bun scripts/publish-android-r2-release.ts \
            --profile "$PROFILE" \
            --apk "$RUNNER_TEMP/artifacts/astral-grove.apk" \
            --out-dir "$RUNNER_TEMP/r2-publish"

      - name: Build combined install page + QR
        id: page
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          RELEASE_LINK_SECRET: ${{ secrets.RELEASE_LINK_SECRET }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.RELEASE_S3_REGION }}
        run: |
          set -euo pipefail
          bun scripts/publish-internal-install-page.ts \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

          {
            echo "### Mobile ${PROFILE} internal build"
            echo
            echo "iOS → \`releases/${PROFILE}.ipa\`, Android → \`releases/${PROFILE}.apk\`."
            echo "Combined install QR (iOS + Android) sent to Discord."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send install QR to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK secret is not set" >&2
            exit 1
          fi

          QR_PATH="$RUNNER_TEMP/r2-publish/${PROFILE}-qr.png"
          test -f "$QR_PATH"

          PAGE_URL=$(jq -r '.pageUrl // empty' "$RUNNER_TEMP/r2-publish/publish-page.json")

          REF_LINE="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "push" ]; then
            REF_LINE="main · $GITHUB_SHA"
          fi

          bun scripts/notify-install-discord.ts \
            --qr "$QR_PATH" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --url "$PAGE_URL" \
            --ref "$REF_LINE"

      # Recorded last so a failed publish leaves the old fingerprint and the next run rebuilds and republishes.
      - name: Record published native fingerprints
        env:
          IOS_FINGERPRINT: ${{ needs.meta.outputs.ios_fingerprint }}
          ANDROID_FINGERPRINT: ${{ needs.meta.outputs.android_fingerprint }}
          S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.RELEASE_S3_REGION }}
        run: |
          set -euo pipefail
          if [ "$BUILT_IOS" = "true" ]; then
            bun scripts/internal-build-fingerprint.ts record --profile "$PROFILE" --platform ios --fingerprint "$IOS_FINGERPRINT"
          fi
          if [ "$BUILT_ANDROID" = "true" ]; then
            bun scripts/internal-build-fingerprint.ts record --profile "$PROFILE" --platform android --fingerprint "$ANDROID_FINGERPRINT"
          fi
