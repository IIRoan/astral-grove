name: iOS App Store build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: TestFlight beta (preview channel) or App Store production (main channel)
        type: choice
        options: [testflight, main]
        default: testflight
      submit:
        description: Upload the completed build to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

# Per ref, so a branch dry run never replaces a pending default-branch release.
concurrency:
  group: ios-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PROFILE: ${{ inputs.profile }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # Only the default branch uploads; other branches may build without submitting.
      - name: Check release branch
        if: inputs.submit && github.ref_name != github.event.repository.default_branch
        working-directory: .
        run: |
          echo "::error::TestFlight uploads require the default branch; turn off submit for a dry run"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check TestFlight app configuration
        if: inputs.submit
        run: |
          bun -e 'const { readFileSync } = require("node:fs"); const config = JSON.parse(readFileSync("eas.json", "utf8")); if (!/^[0-9]+$/.test(config.submit?.production?.ios?.ascAppId ?? "")) throw new Error("Set submit.production.ios.ascAppId before requesting TestFlight submission");'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Signing credentials and the remote build number come from EAS; the archive is built on this runner.
      - name: Build signed App Store binary
        run: |
          set -o pipefail
          eas build --platform ios --profile "$PROFILE" --local --non-interactive --output "$RUNNER_TEMP/astral-grove.ipa" 2>&1 | sed -E -f "$GITHUB_WORKSPACE/scripts/eas-build-log.sed"

      - name: Upload the build to TestFlight
        if: inputs.submit
        run: |
          set -o pipefail
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/astral-grove.ipa" --non-interactive --wait 2>&1 | sed -E -f "$GITHUB_WORKSPACE/scripts/eas-build-log.sed"
